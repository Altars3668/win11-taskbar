name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Check, compile schemas and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs libglib2.0-bin icu-devtools

      - name: Check modules, pure logic, schemas and application ordering
        run: make check

      - name: Test packaging
        run: make test-package

      - name: Compile settings and build extension ZIP
        run: make pack

      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Upload installable extension and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win11-taskbar-${{ github.run_id }}
          path: |
            dist/*.shell-extension.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact package built by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win11-taskbar-${{ github.run_id }}
          path: dist

      - name: Verify downloaded package
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" \
              dist/*.shell-extension.zip dist/SHA256SUMS \
              --verify-tag --title "Windows 11 Taskbar $RELEASE_TAG" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              dist/*.shell-extension.zip dist/SHA256SUMS \
              --verify-tag --title "Windows 11 Taskbar $RELEASE_TAG" \
              --generate-notes
          fi
